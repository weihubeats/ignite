name: Plugin Compatibility Verification

# 定期跑 IntelliJ Plugin Verifier：及时发现新版 IDE 的 API 破坏性变更，避免发版后不可用。
# 手动触发：Actions 页面选择本 workflow 点击 Run workflow。

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 3:00
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify against supported IDEs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify plugin compatibility (IC 2024.3 / 2025.2)
        run: ./gradlew :ignite-plugin:verifyPlugin --stacktrace --continue

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports-${{ github.run_id }}
          path: ignite-plugin/build/reports/pluginVerifier/
          retention-days: 14
          if-no-files-found: ignore
