name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # 同一分支的新提交自动取消旧任务，节省资源
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (wrapper 校验 + 依赖缓存)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          # 非 main/master 分支只读缓存，避免 PR 污染主缓存
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Cache IntelliJ mock JDK (fixture 测试运行时从仓库下载)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/jetbrains/mockjdk
          key: mockjdk-base-java-11

      - name: Build & run tests
        run: ./gradlew :ignite-plugin:test :ignite-plugin:buildPlugin --stacktrace

      - name: Upload test reports (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            ignite-plugin/build/reports/tests/
            ignite-plugin/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: ignite-plugin-zip-${{ github.run_id }}
          path: ignite-plugin/build/distributions/*.zip
          retention-days: 14
          if-no-files-found: error
